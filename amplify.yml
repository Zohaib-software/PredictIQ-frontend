version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify may set NODE_ENV=production, which skips devDependencies (Vite lives there).
        - npm ci --include=dev
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
