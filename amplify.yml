version: 1
frontend:
  # FedCM / Google Sign-In uses postMessage; allow popups with opener (avoids COOP console errors).
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: Cross-Origin-Opener-Policy
          value: same-origin-allow-popups
  phases:
    preBuild:
      commands:
        # Amplify may set NODE_ENV=production, which skips devDependencies (Vite lives there).
        - npm ci --include=dev
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
